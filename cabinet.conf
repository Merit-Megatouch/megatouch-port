# Where the Megatouch cabinet files come from. Sourced by every script.
# Put your own values in cabinet.local.conf (not committed); it is read last.
#
# 1. The disk image (read with debugfs — no mounting, no root). Offsets are partition start
#    sectors x 512 from `fdisk -l`, matched to their /etc/fstab labels. These are for the
#    "Megatouch ION 2014 HDD Keyless" 60 GB image.
IMG="${IMG:-}"               # path to the .img — set it in cabinet.local.conf
ROOT_OFF=$((39584223*512))   # sideB-root      /
ION_OFF=$((49319613*512))    # sideB-ion_only  /usr/local/ion_only   (game assets)
VAR_OFF=$((66107538*512))    # sideB-var       /var
HOME_OFF=$((39262923*512))   # sideB-home      /home
#
# 2. A snapshot made by `make snapshot`. When this folder exists it is used instead of the
#    image, so the 60 GB image can be archived.
CABINET_SNAPSHOT="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)/cabinet"

_cab_local="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)/cabinet.local.conf"
[ -f "$_cab_local" ] && . "$_cab_local"
unset _cab_local
